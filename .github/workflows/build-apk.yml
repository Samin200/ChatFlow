name: Build Android APK

# Yes — GitHub builds the APK for you. No Android Studio needed locally.
# Push to main (or run manually) -> Actions -> download "ChatFlow-APK" artifact.
# The APK is a debug build: installable on any device with "Install unknown apps" allowed.

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.12
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.12-bin.zip
          unzip -q gradle-8.12-bin.zip -d /tmp
          echo "/tmp/gradle-8.12/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChatFlow-APK
          path: android/app/build/outputs/apk/debug/*.apk
